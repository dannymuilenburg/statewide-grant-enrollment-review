<style>

:root[data-theme="dark"]{--bg:#0f1724;--card:#17223a;--ink:#e8edf5;--mute:#9fb0cc;--line:#2b3a57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",Verdana,Arial,sans-serif}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 56px}
h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.15;margin:12px 0 6px}
.sub{font-size:1.2rem;margin:0 0 6px}.hint{color:var(--mute);margin:0 0 28px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--acc);border-radius:4px;padding:18px 20px}
.card:hover,.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card b{display:block;font-size:1.3rem;margin-bottom:6px}.card span{color:var(--mute);font-size:.95rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.home{background:var(--acc);color:#14233b;font-weight:700;text-decoration:none;padding:8px 16px;border-radius:4px}
.home:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar input{flex:1;min-width:180px;max-width:360px;margin-left:auto;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);font:inherit}
.count{color:var(--mute);font-size:.9rem}
.wide{max-width:none}.sn{background:var(--acc);color:#14233b;font-weight:700;padding:8px 12px;border-radius:4px;margin:0 0 10px}.intro{color:var(--mute);max-width:90ch;margin:0 0 18px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--card);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.8rem;line-height:1.35}
td{padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:top;min-width:0;overflow-wrap:break-word}
td.b{font-weight:700}td.sec{font-weight:700;font-size:1.05rem;padding:14px 10px 8px;max-width:none;background:var(--bg)}
table.ov td{border-bottom:0}table.ov td:empty{padding:0;min-width:14px}td.note{max-width:none;color:var(--mute)}
[hidden]{display:none!important}
</style>
<style>
.audit-head{font-size:1.1rem;margin:22px 0 8px}.audit-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}.audit-summary{font-size:.8rem}.audit-detail{font-size:.72rem}.audit-detail td:nth-child(1),.audit-detail td:nth-child(2),.audit-detail td:nth-child(9),.audit-detail td:nth-child(12){text-align:center}.audit-summary tr:first-child td,.audit-detail tr:first-child td{font-weight:700;background:var(--acc);color:#14233b}@media(max-width:800px){.audit-top{grid-template-columns:1fr}}
@media print{.audit-top{grid-template-columns:1fr;gap:12px}.audit-top .scroll{overflow:visible}.audit-head{break-after:avoid}.audit-summary{font-size:7px!important}.audit-detail{font-size:6.4px!important}}
</style>

</style>

],["Source",1,"5B9BD5"],["Why it matters",1,"5B9BD5"]],[["Scope",0,""],["Includes all 459 Start-Up and Modernization grants from 2021–22 through 2026–27. Specialist assignments are not separated.",0,""],["DCTE Grants.xlsx + combined assignment list",0,""],["Single statewide monitoring workbook.",0,""]],[["Strict district-first matching",0,""],["Resolve the historical/current district identity first. A school is then accepted only as an exact school within that district or through an explicit reviewed historical/current alias. No fuzzy, substring, broad-normalized, or global school fallback is used.",0,""],["DCTE Grants.xlsx + current monthly report",0,""],["Prevents a high school from being assigned to an unrelated school because of name similarity.",0,""]],[["Historical reorganizations",0,""],["Umpire K-12, Rural Special High, and Timbo High use explicit reviewed current-district overrides. Other name changes are handled through explicit school aliases only.",0,""],["Historical grant school name + current monthly school identity",0,""],["Allows known reorganized/renamed schools without reintroducing fuzzy matching.",0,""]],[["Unresolved school cases",0,""],["Harmony Grove (2021–22 generic district label) and Dollarway High School remain School/location review rather than being guessed.",0,""],["Grant source + monthly report",0,""],["Only genuinely ambiguous/unsupported matches remain flagged.",0,""]],[["Monthly snapshot",0,""],["Current enrollment comes from CTE Teacher Course Counts.xlsx processed 09/05/2026.",0,""],["CTE Teacher Course Counts.xlsx",0,""],["Authoritative current 2026–27 enrollment source for this review.",0,""]],[["Pathway level rule",0,""],["Use the pathway revision sheet's L1, L2, and L3 designations. Once L3 begins, every subsequent listed course remains Level 3 through the end of that pathway, except Independent Study.",0,""],["2026-2027 SY pathway tab",0,""],["Career Practicum, Pre-Apprenticeship, Youth Apprenticeship, capstone-type courses,
